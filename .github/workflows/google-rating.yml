name: Update Google rating

on:
  schedule:
    # Once per day. The free API Codex tier allows about 40 requests/month;
    # one request/day stays within that allowance.
    - cron: "15 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-google-rating:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Update Google rating data
        env:
          APICODEX_API_KEY: ${{ secrets.APICODEX_API_KEY }}
        run: node scripts/update-google-rating.mjs

      - name: Commit updated reputation data
        run: |
          if git diff --quiet -- lib/google-rating.ts; then
            echo "No Google rating changes detected."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/google-rating.ts
          git commit -m "chore: update Google rating"
          git push
